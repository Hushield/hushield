name: Feature request
description: Suggest a capability or improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before writing: HuShield holds **no personally identifiable information**, anywhere. The only
        identity in the system is an App Attest `key_id` — no accounts, no phone numbers tied to
        reporters, no contact uploads. Proposals that require user identity will be declined, so if
        yours seems to need it, describe the underlying problem and let's find another route.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: >
        Describe the problem, not the solution. Who hits it, how often, and what do they do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What you think should happen. Rough is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (Go / MySQL API)
        - iOS app (SwiftUI)
        - Call Directory extension
        - SMS Filter extension
        - Scoring / trust model
        - Docs or tooling
        - Not sure
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This does not require storing user accounts, phone numbers tied to reporters, contact data, or any other PII
          required: true

  - type: dropdown
    id: implementing
    attributes:
      label: Do you want to implement this?
      description: >
        Entirely optional, and saying no does not weaken the proposal. It just tells us whether to
        label it `help-wanted`.
      options:
        - "Yes, I'd like to build it"
        - "Yes, with some guidance on where to start"
        - "No, I'm suggesting it for someone else to pick up"
    validations:
      required: true
