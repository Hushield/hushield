# HuShield API vhost. TLS terminates here; the Go service binds 127.0.0.1:8080
# and is never reachable directly from the network.
#
# Install: /etc/nginx/conf.d/hushield-api.conf
# Certs are issued with certbot DNS-01 via Route 53 (see ~/bin/cert-manage).

server {
    listen 80;
    listen [::]:80;
    server_name api.hushield.com;

    # ACME http-01 challenges must not be redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.hushield.com;

    ssl_certificate     /etc/letsencrypt/live/api.hushield.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.hushield.com/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # The API is JSON-only and clients are app extensions, not browsers.
    # Requests are small; responses (blocklist deltas) can be large.
    client_max_body_size 1m;

    access_log /var/log/nginx/hushield-api.access.log;
    error_log  /var/log/nginx/hushield-api.error.log;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
