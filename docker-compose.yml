# LOCAL DEVELOPMENT ONLY. Do not deploy this.
#
# Production runs the binary under systemd behind nginx -- see deploy/ and
# scripts/deploy.sh. This file exists so a contributor can get a working stack
# (MySQL + Redis + server) with one command and no local installs.
#
# Two deliberate choices that make it dev-only:
#
#   * MySQL uses a throwaway password. It is not a secret and is not meant to be.
#   * ATTEST_MODE=mock accepts ANY attestation. That is correct for development
#     and catastrophic anywhere reachable.
#
# Database and Redis ports are bound to 127.0.0.1 rather than 0.0.0.0 so that
# running this on a machine with a public interface does not expose MySQL to the
# internet. The previous version published "3306:3306" with an empty root
# password, which on any cloud host is a full database compromise.

services:
  mysql:
    image: mysql:8
    environment:
      # Throwaway local credential; see the header. Not a secret.
      MYSQL_ROOT_PASSWORD: devonly
      MYSQL_DATABASE: spamfilter
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdevonly"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Migrations are go:embed'ed and auto-run on startup (cmd/server/main.go);
      # MYSQL_DATABASE above ensures the schema exists first.
      DB_DSN: "root:devonly@tcp(mysql:3306)/spamfilter?parseTime=true&multiStatements=true"
      ADDR: ":8080"
      # Mock mode: NO real Apple App Attest verification. Dev only.
      ATTEST_MODE: mock
      # Exercises the Redis-backed challenge store, since redis is present here.
      CHALLENGE_STORE: redis
      REDIS_URL: "redis://redis:6379/0"
      # Needed for the admin override routes; empty would disable them (503).
      ADMIN_TOKEN: devonly-admin-token
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql-data:
