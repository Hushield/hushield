name: SpamFilter
options:
  bundleIdPrefix: com.brahy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # John Brahy paid Apple Developer team. APP_ID = 997DW79YCR.com.brahy.spamfilter
    DEVELOPMENT_TEAM: "997DW79YCR"

targets:
  SpamFilter:
    type: application
    platform: iOS
    sources:
      - path: SpamFilter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brahy.spamfilter
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: SpamFilter
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
