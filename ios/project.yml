name: SpamFilter
options:
  bundleIdPrefix: com.brahy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # John Brahy paid Apple Developer team. APP_ID = 997DW79YCR.com.brahy.hushield
    DEVELOPMENT_TEAM: "997DW79YCR"

targets:
  SpamFilterKit:
    type: framework
    platform: iOS
    sources:
      - path: SpamFilterKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brahy.hushield.kit
        PRODUCT_NAME: SpamFilterKit
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: SpamFilterKit/SpamFilterKit.entitlements
        GENERATE_INFOPLIST_FILE: YES

  SpamFilter:
    type: application
    platform: iOS
    sources:
      - path: SpamFilter
    dependencies:
      - target: SpamFilterKit
        embed: true
      - target: CallDirectoryExtension
        embed: true
      - target: MessageFilterExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brahy.hushield
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SpamFilter/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Debug talks to a local server and uses the App Attest DEVELOPMENT
        # environment. Release talks to production and must use the PRODUCTION
        # App Attest environment -- TestFlight and App Store builds attest
        # against production regardless of intent, so a `development`
        # entitlement in a distributed build yields attestations the server
        # rejects with no hint that the environment is the cause.
        debug:
          CODE_SIGN_ENTITLEMENTS: SpamFilter/SpamFilter.entitlements
          SPAMFILTER_API_BASE_URL: http://localhost:8080
        release:
          CODE_SIGN_ENTITLEMENTS: SpamFilter/SpamFilter.Release.entitlements
          SPAMFILTER_API_BASE_URL: https://api.hushield.com
    scheme:
      testTargets:
        - SpamFilterKitTests
        - SpamFilterAppTests
        - SpamFilterUITests

  CallDirectoryExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: CallDirectoryExtension
    dependencies:
      - target: SpamFilterKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brahy.hushield.CallDirectory
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CallDirectoryExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: CallDirectoryExtension/CallDirectoryExtension.entitlements

  MessageFilterExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: MessageFilterExtension
    dependencies:
      - target: SpamFilterKit
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brahy.hushield.MessageFilter
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MessageFilterExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_ENTITLEMENTS: MessageFilterExtension/MessageFilterExtension.entitlements

  SpamFilterKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpamFilterKitTests
        excludes: ["**/*.md"]
    dependencies:
      - target: SpamFilterKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

  SpamFilterAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SpamFilterAppTests
        excludes: ["**/*.md"]
    dependencies:
      - target: SpamFilter
      - target: SpamFilterKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SpamFilter.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/SpamFilter"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SpamFilterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SpamFilterUITests
        excludes: ["**/*.md"]
    dependencies:
      - target: SpamFilter
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
